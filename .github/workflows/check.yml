name: Test and build Muse Multi Studio Windows
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q app run.py
      - run: node --check app/static/app.js
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt pytest pyinstaller
      - name: Build real Windows PE executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name MuseMultiStudio --collect-all uvicorn --add-data "app/static;app/static" launch.py
      - name: Validate backend and Chromium UI from a Unicode Windows folder
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Muse đa luồng - bản kiểm thử'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item -Path dist/MuseMultiStudio -Destination (Join-Path $folder 'MuseMultiStudio') -Recurse -Force
          ./scripts/smoke_windows.ps1 -ExePath (Join-Path $folder 'MuseMultiStudio/MuseMultiStudio.exe')
          if (Test-Path (Join-Path $folder 'MuseMultiStudio/_internal/pythonnet')) {
            throw 'pythonnet unexpectedly bundled into Windows EXE'
          }

      - name: Package portable Windows distribution
        shell: pwsh
        run: Compress-Archive -Path dist/MuseMultiStudio -DestinationPath dist/MuseMultiStudio-Windows-v0.2.1.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MuseMultiStudio-Windows-v0.2.1
          path: dist/MuseMultiStudio-Windows-v0.2.1.zip
          if-no-files-found: error
      - name: Publish tagged beta release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/MuseMultiStudio-Windows-v0.2.1.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
